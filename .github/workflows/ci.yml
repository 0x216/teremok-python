name: CI

on:
  push:
    branches: [main]
    tags-ignore: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - run: ruff check .
      - run: mypy src

  coverage-table:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python scripts/gen_coverage.py
      - name: Fail if docs/coverage.md is stale
        run: git diff --exit-code docs/coverage.md

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        aiogram: ["aiogram==3.4.1", "aiogram"]
        exclude:
          # aiogram 3.4.x predates Python 3.13 support
          - python-version: "3.13"
            aiogram: "aiogram==3.4.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .[dev]
      - run: pip install "${{ matrix.aiogram }}"
      # `pytest --cov=teremok` cannot see this package's own module-level code:
      # teremok registers a pytest11 entry point (teremok.pytest_plugin), so
      # pytest imports the whole package during its early plugin-bootstrap
      # phase - before pytest-cov calls coverage.start(). Wrapping with
      # `coverage run` starts instrumentation before pytest itself loads.
      - run: coverage run --source=teremok -m pytest
      - run: coverage report --fail-under=90

  aiogram-dev:
    # Early-warning leg: run against aiogram's dev branch so a breaking
    # upstream change surfaces here first, without blocking the required
    # matrix above.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - run: pip install "git+https://github.com/aiogram/aiogram.git@dev-3.x"
      - run: pytest
