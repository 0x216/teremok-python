[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teremok"
version = "0.1.0"
description = "Black-box testing for aiogram 3.x Telegram bots - no network, no token"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Maksim Lysenko" }]
keywords = ["aiogram", "telegram", "bot", "testing", "mock", "pytest"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing :: Mocking",
  "Typing :: Typed",
]
dependencies = ["aiogram>=3.4,<4"]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "coverage>=7",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.entry-points.pytest11]
teremok = "teremok.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/teremok"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = ["tests.*"]
strict = false
check_untyped_defs = true
